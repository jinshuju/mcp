name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generated code is up to date with spec/openapi.yaml + mcp.overlay.yaml
        run: |
          npm run generate
          git diff --exit-code --stat src/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm test
      - name: Package smoke test (stdio bin starts and answers --version)
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(npm pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          prefix="$(mktemp -d)"
          npm install -g "./${tgz}" --prefix "${prefix}"
          "${prefix}/bin/jinshuju-mcp" --version
