name: Release

# Publishes a release tag to npm with trusted publishing (OIDC), which only GitHub Actions can do, so there is no
# NPM_TOKEN. The version is bumped and tagged on Gitea (.gitea/workflows/release.yml); the tag reaches this mirror and
# is published from here. npm will not let you configure a trusted publisher for a package that does not exist yet, so
# the first version was published by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm verify this workflow over OIDC. npm attaches provenance on its own for a public repo and
      # package; do not add --provenance, which is for token-based publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1, newer than what the runner image bundles.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: The tag names package.json's version
        run: test "${GITHUB_REF_NAME}" = "v$(npm pkg get version | tr -d '"')"
      - run: npm ci
      - run: npm test
      - name: Verify npm publishes the manifest as written
        shell: bash
        run: |
          set -euo pipefail
          out="$(npm publish --dry-run 2>&1)"
          echo "${out}"
          if grep -q "auto-corrected" <<<"${out}"; then
            echo "::error::npm would rewrite package.json at publish time. Run 'npm pkg fix' and commit the result."
            exit 1
          fi
      - run: npm publish --access public
      - name: Summary
        run: |
          {
            echo "### Published \`@jinshuju/mcp@${GITHUB_REF_NAME#v}\`"
            echo
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- https://www.npmjs.com/package/@jinshuju/mcp"
          } >> "$GITHUB_STEP_SUMMARY"
