name: Sync openapi.yaml

# Fetches the live openapi.yaml once a day; when it changed, regenerates the tools and opens a PR.
# This is how jinshuju/mcp follows openapi.yaml automatically: a person only reviews the tool diff in the PR.
on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Beijing time, daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run spec:update
      - name: Describe the tool changes
        id: summary
        run: node scripts/sync-summary.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-openapi
          commit-message: ${{ steps.summary.outputs.title }}
          title: ${{ steps.summary.outputs.title }}
          body: ${{ steps.summary.outputs.body }}
          labels: openapi-sync
          delete-branch: true
