name: Sync openapi.yaml

# Fetches the live openapi.yaml once a day; when it changed, regenerates the tools and opens a PR.
# This is how jinshuju/mcp follows openapi.yaml automatically: a person only reviews the tool diff in the PR.
on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Beijing time, daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run spec:update
      - name: Summarize tool changes
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo 'The live openapi.yaml changed; the tools have been regenerated.'
            echo
            echo '```'
            git diff --stat -- spec src/generated | tail -20
            echo '```'
            echo
            echo 'Tools:' "$(node -e "console.log(require('./src/generated/meta.json').toolCount)")"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-openapi
          commit-message: 'feat: sync tools with openapi.yaml'
          title: 'feat: sync tools with openapi.yaml'
          body: ${{ steps.summary.outputs.body }}
          labels: openapi-sync
          delete-branch: true
