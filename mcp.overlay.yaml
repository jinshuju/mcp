# MCP 视图覆盖（overlay）
#
# openapi.yaml 是唯一事实来源，这里只描述「怎么把它投影成 MCP 工具」。
# 工具集与 https://open.jinshuju.net/mcp 文档中的 60 个工具一一对应（名字相同），不多暴露。
# 修改本文件后运行 `npm run generate`，产物在 src/generated/，必须一并提交。

# ---- 1. 一一对应的工具：operationId -> 工具名。不在这里的操作不生成工具。 ----
include:
  # 表单
  listForms: list_forms
  getForm: get_form
  createForm: create_form
  updateForm: edit_form
  copyForm: copy_form
  moveFormToFolder: move_form
  listFormCooperators: list_form_cooperators
  listFieldRules: get_field_rules
  checkFormFieldData: check_field_data
  previewFormFieldTypeChange: preview_field_type_change
  updateFormTheme: edit_theme
  # 数据
  listEntries: list_entries
  getEntry: get_entry
  createEntry: create_entry
  updateEntry: update_entry
  deleteEntry: delete_entry
  createEntriesBatch: create_entries
  patchEntriesBatch: patch_entries
  aggregateEntries: aggregate_entries
  summarizeEntries: get_form_data_summary
  searchEntriesAcrossForms: search_entries_in_forms
  getEntryStats: list_form_entry_stats
  listMyFilledForms: list_my_submitted_forms
  listMySubmittedEntries: list_my_submitted_entries
  searchMySubmittedEntries: search_my_submitted_entries
  createEntryImport: import_entries_from_file
  # 评论
  listEntryComments: list_entry_comments
  createEntryComment: create_entry_comment
  updateEntryComment: update_entry_comment
  deleteEntryComment: delete_entry_comment
  # 视图
  listFormViews: list_form_views
  getFormView: get_form_view
  createFormView: create_form_view
  updateFormView: edit_form_view
  deleteFormView: delete_form_view
  listFormViewEntries: list_form_view_entries
  # 表格
  listTables: list_tables
  getTable: get_table
  createTable: create_table
  updateTable: edit_table
  moveTableToFolder: move_table
  # 对外查询 / 文件夹 / 账户
  listOpensearchQueries: list_opensearch_queries
  getOpensearchQuery: get_opensearch_query
  createOpensearchQuery: create_opensearch_query
  updateOpensearchQuery: edit_opensearch_query
  listOpensearchQuerySuggestions: get_opensearch_field_suggestions
  listFolders: list_folders
  createFolder: create_folder
  getCurrentUser: get_current_user
  getBillingAccount: get_current_billing_account
  listBillingAccountUsers: list_account_users
  # 上传。预签名上传（prepare_*_upload）不在 openapi 里；这里提供直接上传（base64 进 MCP），名字随接口。
  uploadEntryAttachment: upload_entry_attachment
  uploadFormImage: upload_form_image
  uploadImportFile: upload_import_file

# ---- 2. 投影：一个工具 = 某个操作请求体里的一个子键，子键的属性提升到顶层 ----
projections:
  edit_field_rules:
    operationId: updateForm
    bodyKey: field_rules
    title: Edit field rules
    description: >-
      Edits a form's field display rules (logic jumps) incrementally and leaves the other rules unchanged; the index is the one
      get_field_rules returns. Same as edit_form with only field_rules.

# ---- 3. 组合工具：一次调用发两个请求（考试 / 测评表单的建与改、多表单计数） ----
composites:
  create_exam_form:
    kind: scene_form_create
    scene: exam
    settingOperation: updateExamSetting
    settingKey: exam_setting
    title: Create an exam form
    description: >-
      Creates an online exam form (scene=exam, scored automatically). Use it, not create_form, when the user wants an exam, test or quiz;
      an evaluation such as a psychological test, ability assessment, self-assessment questionnaire or training feedback uses create_evaluation_form.
      Questions must use exam question types (SingleSelect / MultiSelect / TrueOrFalse / DropDownSelect / FillInBlank / ShortAnswer / FillInNumber),
      each with answers (the correct answer and its score; the default absolute mode has one correct answer and scores only a fully correct response).
      Creates the form first, then applies exam_setting; if the settings are rejected, the form already exists and the result says so.
  edit_exam_form:
    kind: scene_form_update
    scene: exam
    settingOperation: updateExamSetting
    settingKey: exam_setting
    title: Edit an exam form
    description: >-
      Edits an exam form: name / description / adding, removing and changing questions / general settings, plus the exam settings in exam_setting.
      Updates the exam settings first (a form that is not an exam is refused, and nothing else changes), then the form itself.
  create_evaluation_form:
    kind: scene_form_create
    scene: evaluation
    settingOperation: updateEvaluationSetting
    settingKey: evaluation_setting
    title: Create an evaluation form
    description: >-
      Creates an evaluation form (scene=evaluation). Use it when the user wants an evaluation, psychological test, ability assessment,
      self-assessment questionnaire or training feedback; not create_form, and not create_exam_form (an exam with correct answers).
      A scored evaluation uses SingleSelect / MultiSelect / DropDownSelect / Rating / Nps: each question lists every choice with its score in answers
      and sets answer_setting_mode=relative (every choice scores, none is right or wrong; the default absolute accepts one correct answer and scores any other choice 0).
      Do not score with a regular choice field's calculable / operand_value. A feedback questionnaire uses regular fields (RatingField / MatrixScaleField / TextArea, etc.) without scores.
      Creates the form first, then applies evaluation_setting (the report after submission, comments by total score range, dimensions).
  edit_evaluation_form:
    kind: scene_form_update
    scene: evaluation
    settingOperation: updateEvaluationSetting
    settingKey: evaluation_setting
    title: Edit an evaluation form
    description: >-
      Edits an evaluation form: name / description / adding, removing and changing questions / general settings, plus the evaluation settings in evaluation_setting.
      Updates the evaluation settings first, then the form itself.
      Scored questions write answers / answer_setting_mode as in create_evaluation_form (one answer per choice, with relative).
  count_entries:
    kind: count_entries
    title: Count entries
    description: >-
      Counts the entries matching the conditions, without returning them. A single form_token counts one form (keyword / filters supported);
      an array of up to 10 tokens counts several forms in one call and gives the total (filters can then use only created_at / updated_at / creator_id, and keyword is not supported).

# ---- 4. 生成规则 ----

# 体积大、按 type 分支的 schema 不内联进工具的 inputSchema / outputSchema，
# 改为一句指针说明 + `get_schema` 工具 / `jinshuju://schemas/{name}` 资源按需读取。
pointerSchemas:
  - FieldInput
  - FieldUpdateInput
  - FieldDefinition
  - FormSettingWriteInput
  - FormSettingInput
  - FormSetting
  - ThemeInput
  - FormTheme
  - EvaluationSettingInput
  - EvaluationSetting
  - FormViewInput
  - FormView
  - OpensearchQueryInput
  - OpensearchQuery
  - GoodsItemInput
  - EntryData
  - TradeMerchant
  - BillingAccount

# 只用于服务端校验的组合约束（if/then），对模型没有信息量，从工具入参里去掉；服务端照样校验。
omitSchemas:
  - FormCreateConstraints

# 内联在入参里的「按 type 分支」联合（每个分支都有 title）达到这个分支数就折叠：
# 只留公共属性，把分支名写进描述，细节用 get_schema 查。表格列定义（11 种）就是靠它从 12k 字符降到几百。
collapseVariantsMinBranches: 3

# outputSchema 只在压缩后不超过这个字符数时随 tools/list 下发（太大的改为描述里一句「返回：XXX」）。
outputSchemaMaxChars: 700

# 请求体怎么进工具入参：缺省 flatten（请求体的属性提升到顶层）；
# 这里列出的操作改为嵌在一个键下（数据本身、以及整个请求体就是一个大 schema 指针的那些）。
bodyParam:
  createEntry: entry
  updateEntry: entry
  updateFormTheme: theme
  createFormView: view
  updateFormView: view
  createOpensearchQuery: query
  updateOpensearchQuery: query

# ---- 5. 按共享参数覆盖：key 是 components.parameters 里的名字，descriptionAppend 追加到所有引用它的操作 ----
parameters:
  EntriesFilters:
    descriptionAppend: |-
      - To find entries whose multiple-choice field contains a choice, use `any_in` (`none_in` to exclude); `eq` is not "contains": it matches only entries with exactly the same set of choices.

# ---- 6. 按操作覆盖：descriptionAppend（追加说明）、description（整段替换 openapi 的描述，只在原文对模型是噪音时用）、
#         annotations（覆盖推断）、outputSchema（true / false 强制） ----
tools:
  listForms:
    descriptionAppend: >-
      Usually the first call of a session: get the form token here, then call get_form / list_entries.
  getForm:
    descriptionAppend: The api_code of each field in the returned fields is its key when reading and writing entries.
  createForm:
    descriptionAppend: >-
      Each item of fields branches on type: get_schema("FieldInput") lists the types, then get_schema("<Type>Input")
      (e.g. "TextFieldInput") shows the properties that type accepts; do not guess field properties. For an exam or evaluation form use create_exam_form / create_evaluation_form.
  updateForm:
    descriptionAppend: Before removing a field or choice, check_field_data tells whether it already has entries; removal cannot be undone. To change only field rules, use edit_field_rules.
  deleteEntry:
    annotations: { destructiveHint: true }
  createEntryImport:
    descriptionAppend: >-
      Only for a file the client actually holds and has uploaded with upload_import_file. Table / CSV text pasted into the conversation goes straight to create_entries (at most 200 per batch); do not turn it into a file to import.
  uploadImportFile:
    # openapi 原文讲的是 HTTP 鉴权与 multipart，对 MCP 调用方是噪音，整段替换。
    description: >-
      Uploads a spreadsheet file (xlsx / xls / csv) the client actually holds to the given form and returns the import attachment id; pass it as attachment_id to import_entries_from_file to start the import.
      Table / CSV text pasted into the conversation does not go through here (do not encode it as base64 and upload it as a file); write it with create_entries (at most 200 per batch).
      The file size is capped by the plan's Excel import limit, and the extension must be xls / xlsx / csv; otherwise returns 422 with the reason in error_description.
