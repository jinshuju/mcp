name: Release

# Keeps the version moving, as release-please did on GitHub (scripts/release.mjs): every push to main refreshes the
# release pull request `chore(main): release X.Y.Z` from the conventional commits since the last tag, and merging it
# tags the version and writes the Gitea release. GitHub's release.yml then publishes the mirrored tag to npm with
# trusted publishing, which only GitHub Actions can do.
#
# Commit subjects must be plain conventional commits: `#T17067 feat: ...` does not parse and never releases. Put the
# ticket in a footer; a `Release-As: X.Y.Z` footer sets the version.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The job token pushes the branch and the tag and opens the pull request.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag the merged release, keep the release PR current
    runs-on: docker
    timeout-minutes: 10
    container:
      image: node:22
    steps:
      - uses: builtin:checkout
        with:
          # The commits since the last tag.
          fetch-depth: 0
      # A container job's workspace may belong to another user than the one running git, which git refuses by default.
      - run: git config --global --add safe.directory '*'
      - env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: node scripts/release.mjs
