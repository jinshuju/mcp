# Eval fixtures: the data assertions depend on. `npm run eval -- seed` creates the forms and loads the entries described here
# in the eval account, and records their tokens / api_codes in evals/state/fixtures.json. The sample set and the data are
# versioned together: change this file, then seed again.
# Form names, field labels, choices and entries are test data in Chinese, like the tasks that query them.
#
# Conventions:
# - fields[].key is the fixture's own field key; task state assertions refer to fields by it. label is unique within a form,
#   and seed maps it to the api_code.
# - Entry keys are field keys; choices use their labels, multiple choices an array, dates YYYY-MM-DD.
# - A form with entries is reset to exactly these entries on seed.

folder: MCP 评测数据（勿动）
output_folder: MCP 评测产出（可删）
results_form: MCP 评测结果（自动写入）

